name: Pomodoro checks

on:
  push:
    paths:
      - 'Pomodoro Timer/**'
      - '.github/workflows/pomodoro.yml'
  pull_request:
    paths:
      - 'Pomodoro Timer/**'
      - '.github/workflows/pomodoro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: 'Pomodoro Timer'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # The checks/build use only Node built-ins: no dependency install needed.
      - run: npm run check
